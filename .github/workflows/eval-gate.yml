name: Eval gate

# Runs the agent against a hosted model, so it costs money: only on PRs that
# carry the "eval" label and touch what can change agent behaviour.
on:
  pull_request:
    types: [labeled, synchronize, opened, reopened]
    paths:
      - "src/agent/core/**"
      - "src/agent/tools/**"
      - "src/agent/llm/**"
      - "configs/prompts/**"
      - "configs/models.yaml"
      - "evals/**"

permissions:
  contents: read

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"
  EVAL_MODEL: qwen27b-hosted

jobs:
  gate:
    if: contains(github.event.pull_request.labels.*.name, 'eval')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Check prerequisites
        id: pre
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          baseline=$(uv run --quiet python -c "import yaml; print(yaml.safe_load(open('evals/baselines.yaml')).get('$EVAL_MODEL', {}).get('toolcalls') or '')")
          if [ -z "$OPENROUTER_API_KEY" ] || [ -z "$baseline" ]; then
            echo "::notice::Eval gate skipped: needs the OPENROUTER_API_KEY secret and a $EVAL_MODEL baseline in evals/baselines.yaml"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install and build sandbox
        if: steps.pre.outputs.run == 'true'
        run: uv sync && make sandbox

      - name: Tool-call eval
        if: steps.pre.outputs.run == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run agent eval toolcalls -m "$EVAL_MODEL" --out eval-out

      - name: Golden tasks (k=1)
        if: steps.pre.outputs.run == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run agent eval tasks -m "$EVAL_MODEL" -k 1 --max-cost 0.25 --out eval-out

      - name: Compare with baseline
        if: steps.pre.outputs.run == 'true'
        run: |
          set -e
          for kind in toolcalls tasks; do
            base=$(uv run --quiet python -c "import yaml; print(yaml.safe_load(open('evals/baselines.yaml'))['$EVAL_MODEL']['$kind'])")
            cand=$(ls eval-out/*_${kind}_*.json | head -1)
            drop=$(uv run --quiet python -c "import yaml; print(yaml.safe_load(open('evals/baselines.yaml'))['max_drop']['$kind'])")
            uv run agent eval compare "$base" "$cand" --max-drop "$drop"
          done

      - name: Upload results
        if: always() && steps.pre.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results
          path: eval-out/
