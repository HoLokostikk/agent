[project]
name = "agent"
version = "0.1.0"
description = "Terminal coding agent on an open-weight model"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "HoLokostikk", email = "kostiantyn.holovskyi.shi.2025@lpnu.ua" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.16.0",
    "mcp>=2.3.0",
    "numpy>=2.2",
    "openai>=3.46.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.28.0",
]

[project.scripts]
agent = "agent.cli.app:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Task repositories are fixtures with deliberate bugs, not project code.
extend-exclude = ["evals/tasks/*/repo", "evals/tasks/*/hidden", "evals/tasks/*/solution"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "S", "PT", "ASYNC", "RUF"]
# Ukrainian text in docs and comments would trip the ambiguous-character rules.
# S607: git and docker are resolved from PATH on purpose.
ignore = ["RUF001", "RUF002", "RUF003", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
exclude = ["evals/tasks/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not live and not docker'"
markers = [
    "live: needs a running local model server (make test-live)",
    "docker: starts real sandbox containers (make test-docker)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
