bash:
  deny:
    - '\brm\s+(-[a-zA-Z]*[rf][a-zA-Z]*\s+)+(/|~|\$HOME|\*|\.)(\s|$)'
    - '\b(curl|wget|nc|ncat|netcat|ssh|scp|rsync|ftp|telnet)\b'
    - '\bsudo\b|\bsu\s'
    - '\bgit\s+push\b'
    - '\bmkfs\b|\bdd\s+if='
    - ':\(\)\s*\{'
    - '\bchmod\s+-R\s+777\b'
  allow:
    - 'pytest*'
    - 'python -m pytest*'
    - 'ls*'
    - 'cat *'
    - 'head *'
    - 'tail *'
    - 'wc *'
    - 'git status*'
    - 'git diff*'
    - 'git log*'
    - 'python --version'

write_deny:
  - '.git/*'
  - '.git'
  - '.env'
  - '.env.*'
