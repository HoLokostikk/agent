model_list:
  - model_name: agent-main
    litellm_params:
      model: openai/ft-v1
      api_base: http://127.0.0.1:8000/v1
      api_key: not-needed
  - model_name: agent-base
    litellm_params:
      model: openai/qwen27b
      api_base: http://127.0.0.1:8000/v1
      api_key: not-needed
  - model_name: agent-hosted
    litellm_params:
      model: openrouter/qwen/qwen3.8-27b-20260814
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: agent-local
    litellm_params:
      model: openai/qwen2.5-3b-instruct-8k
      api_base: http://127.0.0.1:11434/v1
      api_key: not-needed

router_settings:
  num_retries: 2
  timeout: 300
  fallbacks:
    - agent-main: [agent-base, agent-hosted, agent-local]
  allowed_fails: 3
  cooldown_time: 30

litellm_settings:
  drop_params: true
  max_budget: 20
  budget_duration: 30d
